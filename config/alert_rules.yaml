alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(latency_ms of event == "response_sent") > 3000ms liên tục 5 phút'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602911
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: 'error_rate_pct > 2% và count(event == "request_failed") >= 3 trong 3 phút'
    duration: 3m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602911
    runbook: docs/alerts.md#alert-2
  - name: RetrievalSuccessDrop
    severity: warning
    condition: 'retrieval_success_rate_pct < 90% trên mọi event có field tool_success, liên tục 10 phút'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602911
    runbook: docs/alerts.md#alert-3
